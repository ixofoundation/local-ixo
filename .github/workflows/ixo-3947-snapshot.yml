name: IXO-3947 fixed-height network snapshot

on:
  workflow_dispatch:
    inputs:
      activity_blocks:
        description: Recent block window used for tx_search activity capture
        required: false
        default: "10000"
  pull_request:
    branches: [main]
    paths:
      - "research/ixo-3947/**"
      - ".github/workflows/ixo-3947-snapshot.yml"

permissions:
  contents: read

jobs:
  capture:
    name: Capture and validate Impact Hub state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVITY_BLOCKS: ${{ github.event.inputs.activity_blocks || '10000' }}
      MAX_TX_PAGES: "30"
      GOV_DETAIL_LIMIT: "10"
      HTTP_TIMEOUT: "12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          set -euo pipefail
          bash --version | head -1
          curl --version | head -1
          jq --version
          python3 --version
          sha256sum --version | head -1

      - name: Syntax and bytecode checks
        run: |
          set -euo pipefail
          bash -n research/ixo-3947/capture.sh
          python3 -m py_compile research/ixo-3947/capture_ci.py research/ixo-3947/capture_ci_compat.py research/ixo-3947/derive.py research/ixo-3947/enrich.py

      - name: Capture fixed-height primary evidence
        run: |
          set -euo pipefail
          python3 research/ixo-3947/capture_ci_compat.py artifacts/ixo-3947
          python3 research/ixo-3947/enrich.py artifacts/ixo-3947
          (
            cd artifacts/ixo-3947
            find . -type f ! -path './hashes/sha256sums.txt' -print0 | sort -z | xargs -0 sha256sum > hashes/sha256sums.txt
          )

      - name: Show derived summary
        if: always()
        run: |
          test -f artifacts/ixo-3947/derived/summary.json && jq . artifacts/ixo-3947/derived/summary.json || true
          test -f artifacts/ixo-3947/derived/validation.json && jq . artifacts/ixo-3947/derived/validation.json || true

      - name: Upload immutable evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixo-3947-fixed-height-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ixo-3947
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce core evidence gates
        run: |
          set -euo pipefail
          jq -e '.pass == true and .reproduction_grade == "R2"' artifacts/ixo-3947/derived/validation.json
          jq -e '.extended_checks.liquid_staking_pool_configuration_captured == true and .extended_checks.liquid_staking_live_state_captured == true' artifacts/ixo-3947/derived/validation.json
          test -s artifacts/ixo-3947/hashes/sha256sums.txt
          test "$(jq '.providers | length' artifacts/ixo-3947/selected-block.json)" -ge 2
